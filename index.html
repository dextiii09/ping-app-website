<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ping · Local brands. Local creators. One ping apart.</title>
    <meta name="theme-color" content="#0a0a0a">

    <!-- Primary Meta Tags -->
    <meta name="title" content="Ping | Hyperlocal Creator-Business Marketplace">
    <meta name="description" content="Local businesses post campaigns with a fixed fee; local creators, comedians, DJs and bands apply; brands swipe to pick and chat straight away. Free during the pilot.">
    <meta name="keywords" content="hyperlocal influencer marketing, local creators, local business marketing, micro influencers, nano influencers, live briefs, smart proposals, ping">
    <meta name="author" content="ReachUp Media">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://pingapp.site/">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://pingapp.site/">
    <meta property="og:title" content="Ping · Local brands. Local creators. One ping apart.">
    <meta property="og:description" content="Local businesses post a campaign, local creators, comedians, DJs and bands apply, and brands swipe to pick. Free during the pilot.">
    <meta property="og:image" content="https://pingapp.site/assets/images/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Ping: Local brands. Local creators. One ping apart.">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="Ping · Local brands. Local creators. One ping apart.">
    <meta property="twitter:description" content="Local businesses post a campaign, local creators, comedians, DJs and bands apply, and brands swipe to pick. Free during the pilot.">
    <meta property="twitter:image" content="https://pingapp.site/assets/images/og-image.png">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/assets/images/ping-mark.svg">

    <!-- Typography: Inter for the app; Geist, Geist Mono and Instrument Serif for the public pages -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons Web -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.2"></script>
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>

    <!-- Luxury Design System Styling -->
    <link rel="stylesheet" href="./assets/css/platform.css">
    <link rel="stylesheet" href="./assets/css/landing.css">
    <link rel="stylesheet" href="./assets/css/app-theme.css">
</head>
<body>

    <!-- Ambient Dynamic Glow Backdrop -->
    <div class="platform-glow"></div>

    <!-- Sign Up / Log In Gate (shown until Supabase Auth confirms a session) -->
    <div id="authGateRoot"></div>

    <!-- Executive Navigation Header -->
    <header class="platform-header" id="platformHeader"></header>

    <!-- Dynamic Platform Viewport -->
    <main class="platform-viewport" id="platformViewport"></main>

    <!-- Global Platform Toast Notification -->
    <div class="platform-toast" id="platformToast">
        <i class="ph-fill ph-check-circle" style="color:var(--gold); font-size:22px;"></i>
        <span class="toast-content">Notification</span>
    </div>

    <!-- Modals Container -->
    <div id="platformGlobalModals"></div>

    <!-- Master Platform Controller Bootstrapper -->
    <script type="module">
        import { store } from './assets/js/state.js';
        import { platform } from './assets/js/platform.js';
        import { onAuthChange, getUserProfile, isPasswordRecovery } from './assets/js/authService.js';
        import { watchTable } from './assets/js/supabaseClient.js';
        import { renderAuthGate } from './assets/js/views/authView.js';
        import { renderSocialOnboarding } from './assets/js/views/socialOnboardingView.js';
        import { renderLanding } from './assets/js/views/landingView.js';
        import { coverScreen, revealScreen } from './assets/js/landing/motionUtils.js';

        // The landing intro and scroll-driven animations assume a fresh start
        // at the top; don't let the browser restore an old scroll position.
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

        let platformStarted = false;
        let startedUid = null;

        // Logged-out routing: the public landing page by default, the auth
        // form at #login / #join-creator / #join-brand (hash-based so the
        // browser Back button and shared links work).
        let showingPublic = false;
        let currentView = null;   // 'landing' or a PUBLIC_ROUTES key
        let destroyPublic = null; // cleanup for whichever public view is mounted
        let returnTo = null;      // landing section to scroll back to after "Back"
        let transitioning = false;
        const PUBLIC_ROUTES = {
            login: { mode: 'login' },
            'join-creator': { mode: 'signup', role: 'INFLUENCER' },
            'join-brand': { mode: 'signup', role: 'BUSINESS' }
        };

        function renderPublicRoute() {
            if (!showingPublic || platformStarted) return;
            const key = window.location.hash.slice(1);
            const route = PUBLIC_ROUTES[key];
            const next = route ? key : 'landing';
            if (next === currentView) return; // e.g. an in-page anchor - nothing to swap
            const root = document.getElementById('authGateRoot');
            if (destroyPublic) { destroyPublic(); destroyPublic = null; }
            window.scrollTo(0, 0);
            if (route) {
                destroyPublic = renderAuthGate(root, { ...route, onBack: () => navigate('', null) });
            } else {
                const scrollTo = returnTo;
                returnTo = null;
                destroyPublic = renderLanding(root, {
                    skipIntro: currentView !== null, // the intro only greets a fresh visit
                    scrollTo,
                    onChooseRole: (role, point) => navigate(role === 'BUSINESS' ? 'join-brand' : 'join-creator', point, 'choose'),
                    onLogin: (point) => navigate('login', point)
                });
            }
            currentView = next;
            revealScreen();
        }

        // Ripple transition, then swap views. '' returns to the landing page
        // without leaving a bare "#" in the address bar.
        async function navigate(hash, point, from = null) {
            if (transitioning) return;
            transitioning = true;
            if (hash) returnTo = from; // going back keeps the spot we left from
            try { await coverScreen(point); } finally { transitioning = false; }
            if (hash) {
                window.location.hash = hash;
            } else {
                history.pushState(null, '', window.location.pathname + window.location.search);
                renderPublicRoute();
            }
        }

        function showPublic() {
            showingPublic = true;
            renderPublicRoute();
        }

        window.addEventListener('hashchange', renderPublicRoute);
        window.addEventListener('popstate', renderPublicRoute);

        function startPlatform() {
            if (platformStarted) return;
            platformStarted = true;
            if (destroyPublic) { destroyPublic(); destroyPublic = null; }
            currentView = null;
            revealScreen();
            if (PUBLIC_ROUTES[window.location.hash.slice(1)]) history.replaceState(null, '', window.location.pathname);
            document.body.classList.remove('pre-auth');
            document.getElementById('authGateRoot').innerHTML = '';
            platform.init();
            window.pingPlatform = platform;
        }

        // A suspended member (status BANNED, set from Operations) gets this
        // screen instead of the app, and an open session is stopped the
        // moment the admin suspends them.
        function showSuspended() {
            if (destroyPublic) { destroyPublic(); destroyPublic = null; }
            currentView = 'suspended';
            revealScreen();
            destroyPublic = renderAuthGate(document.getElementById('authGateRoot'), { mode: 'suspended' });
        }

        function watchForSuspension(uid) {
            watchTable('profiles', async () => {
                try {
                    const latest = await getUserProfile(uid);
                    if (latest && latest.status === 'BANNED') {
                        localStorage.removeItem('ping_platform_state_v1');
                        window.location.reload();
                    }
                } catch (e) { /* offline: checked again on the next change */ }
            }, `id=eq.${uid}`);
        }

        // The profile write (in authService.signUp) can lose the race
        // against the auth-state event that fires right after account creation,
        // so retry briefly instead of failing on the first miss.
        async function fetchProfileWithRetry(uid, attempts = 6) {
            for (let i = 0; i < attempts; i++) {
                const profile = await getUserProfile(uid);
                if (profile) return profile;
                await new Promise(r => setTimeout(r, 350));
            }
            return null;
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('pre-auth');

            onAuthChange(async (user) => {
                // Arrived from a password-reset link: ask for a new password
                // before letting them into the app.
                if (user && isPasswordRecovery() && !platformStarted) {
                    if (destroyPublic) { destroyPublic(); destroyPublic = null; }
                    currentView = 'reset';
                    revealScreen();
                    destroyPublic = renderAuthGate(document.getElementById('authGateRoot'), {
                        mode: 'reset',
                        onDone: () => { history.replaceState(null, '', window.location.pathname); window.location.reload(); }
                    });
                    return;
                }
                if (user) {
                    if (platformStarted) {
                        // A different account signed in elsewhere in this browser:
                        // this tab is now showing someone else's session.
                        if (user.uid !== startedUid) window.location.reload();
                        return;
                    }
                    const profile = await fetchProfileWithRetry(user.uid);
                    if (profile && profile.status === 'BANNED') {
                        showSuspended();
                    } else if (profile) {
                        startedUid = user.uid;
                        store.hydrateRealUser(profile);
                        startPlatform();
                        watchForSuspension(user.uid);
                    } else {
                        // No users/{uid} doc after retrying - for email
                        // signup that would be a lost race (rare, and
                        // retried above), but for a first-time Google/
                        // Facebook sign-in this is the normal case, since
                        // those providers never create the doc themselves.
                        if (destroyPublic) { destroyPublic(); destroyPublic = null; }
                        currentView = null;
                        revealScreen();
                        destroyPublic = renderSocialOnboarding(document.getElementById('authGateRoot'), user, (createdProfile) => {
                            startedUid = user.uid;
                            store.hydrateRealUser(createdProfile);
                            startPlatform();
                            watchForSuspension(user.uid);
                        });
                    }
                } else if (platformStarted) {
                    // The session was already running and just went away -
                    // NOT the normal startup case (that's handled below).
                    // This fires if the user is signed out in another tab
                    // (Supabase broadcasts auth state across tabs for the
                    // same browser), or their token is revoked/expired
                    // server-side. Without this, a previously-authenticated
                    // tab would keep showing the full app - private data,
                    // working nav, everything - with no indication the
                    // session underneath it was gone. Force the same clean
                    // reload the manual Log Out button already does, rather
                    // than trying to tear down a live app instance in place.
                    localStorage.removeItem('ping_platform_state_v1');
                    window.location.reload();
                } else {
                    showPublic();
                }
            });
        });
    </script>
</body>
</html>
